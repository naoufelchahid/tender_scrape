version: '3.8'

services:
  ocr-container:
    build:
      context: ./ocr_container
    container_name: ocr-container
    env_file:
      - ./ocr_container/.env
    volumes:
      - ./ocr_container/logs:/app/logs
      - ./ocr_container/temp:/app/temp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  classification-container:
    build:
      context: ./classification_container
    container_name: classification-container
    env_file:
      - ./classification_container/.env
    # No explicit volumes mentioned in Dockerfile, but might need AWS creds if not passed via env
    restart: unless-stopped

  extraction-container:
    build:
      context: .
      dockerfile: ./extraction_container/Dockerfile
    container_name: extraction-container
    env_file:
      - ./extraction_container/.env
    restart: unless-stopped
