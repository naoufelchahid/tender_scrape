version: '3.8'

services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: fuseki
    ports:
      - "3030:3030"
    environment:
      # Set fixed admin password (must match JENA_PASSWORD in .env)
      ADMIN_PASSWORD: admin
      # Optional: JVM memory settings
      JVM_ARGS: "-Xmx2g"
    volumes:
      # Persist Fuseki data between container restarts
      - fuseki_data:/fuseki
      # Optional: Mount custom configuration
      # - ./fuseki-config:/fuseki-config
    networks:
      - tender_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3030/$/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  tender_network:
    driver: bridge
    name: tender_network

volumes:
  fuseki_data:
    driver: local
