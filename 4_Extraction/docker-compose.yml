version: '3.8'

services:
  extraction:
    build:
      context: ..
      dockerfile: 4_Extraction/Dockerfile
    container_name: extraction
    env_file:
      - .env
    networks:
      - tender_network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ../pipeline.db:/app/pipeline.db
      - ../pipeline.db-shm:/app/pipeline.db-shm
      - ../pipeline.db-wal:/app/pipeline.db-wal

networks:
  tender_network:
    driver: bridge
    name: tender_network
    external: true
