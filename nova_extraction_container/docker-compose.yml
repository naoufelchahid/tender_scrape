version: '3.8'

services:
  nova-extraction:
    build: .
    container_name: nova-extraction-container
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ~/.aws:/root/.aws:ro # AWS credentials (read-only)
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py
