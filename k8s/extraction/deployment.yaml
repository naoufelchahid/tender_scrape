apiVersion: apps/v1
kind: Deployment
metadata:
  name: extraction
  namespace: tender-pipeline
  labels:
    app: extraction
    stage: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extraction
  template:
    metadata:
      labels:
        app: extraction
        stage: "4"
    spec:
      containers:
        - name: extraction
          image: tender-extraction:latest
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: OPENROUTER_API_KEY
