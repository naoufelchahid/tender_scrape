apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: tender-pipeline
  labels:
    app: ingestion
    stage: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
        stage: "5"
    spec:
      initContainers:
        - name: wait-for-fuseki
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://fuseki:3030/$/ping > /dev/null 2>&1; do
                echo "Waiting for Fuseki..."; sleep 5;
              done
              echo "Fuseki is ready."
      containers:
        - name: ingestion
          image: tender-ingestion:latest
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "500m"
              memory: "1.5Gi"
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: OPENROUTER_API_KEY
            - name: JENA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fuseki-auth
                  key: JENA_USERNAME
            - name: JENA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fuseki-auth
                  key: JENA_PASSWORD
