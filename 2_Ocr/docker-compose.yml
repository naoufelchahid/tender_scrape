version: '3.8'

services:
  ocr-service:
    build: .
    container_name: ocr-container
    env_file:
      - .env
    environment:
      - AWS_DEFAULT_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - RESULTS_OCR_QUEUE_URL=${RESULTS_OCR_QUEUE_URL:-}
      - RESULTS_INGESTION_QUEUE_URL=${RESULTS_INGESTION_QUEUE_URL:-}
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
    restart: unless-stopped
    mem_limit: 8g
    runtime: nvidia
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
