version: '3.8'

services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin
      JVM_ARGS: "-Xmx2g"
    volumes:
      - fuseki_data:/fuseki
    networks:
      - tender_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3030/$/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  tender_network:
    driver: bridge
    name: tender_network
    external: false

volumes:
  fuseki_data:
    driver: local
